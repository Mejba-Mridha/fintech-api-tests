[pytest]
# ─── Test discovery ───────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ─── Markers ──────────────────────────────────────────────────────────────────
# Run by marker:  pytest -m smoke
#                 pytest -m "regression and not slow"
markers =
    smoke:       Fast, critical-path tests — run on every commit
    regression:  Full regression suite
    auth:        Authentication & authorization tests
    accounts:    Account management tests
    payments:    Payment processing tests
    transactions: Transaction history tests
    negative:    Negative / error-path tests
    schema:      JSON schema validation tests
    slow:        Tests that take > 5 seconds

# ─── Output & reporting ───────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results
    --reruns=2
    --reruns-delay=1

# ─── Logging ──────────────────────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
